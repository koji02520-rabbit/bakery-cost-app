<div class="sheet-backdrop" data-close-picker></div>
<section class="sheet" role="dialog" aria-modal="true" aria-labelledby="picker-title">
  <div class="sheet-head">
    <h2 id="picker-title">{% if item %}「{{ item.material.name }}」を別の材料に変える{% else %}材料を追加する{% endif %}</h2>
    <button type="button" class="btn" data-close-picker>閉じる</button>
  </div>
  <form class="picker-search" hx-get="{% url 'recipe_picker' recipe.pk %}" hx-target="#picker-results"
        hx-trigger="input changed delay:250ms from:input[name=q], change, submit">
    <input type="hidden" name="results" value="1">
    <input type="hidden" name="row" value="{{ item.pk|default:'' }}">
    <input type="search" name="q" value="{{ q }}" placeholder="材料名・IDで探す" aria-label="材料を探す" autofocus autocomplete="off">
    <div class="choice-row">
      <label class="choice"><input type="radio" name="scope" value="all" {% if scope == 'all' %}checked{% endif %}> すべて</label>
      <label class="choice"><input type="radio" name="scope" value="ingredient" {% if scope == 'ingredient' %}checked{% endif %}> 食材</label>
      <label class="choice"><input type="radio" name="scope" value="recipe" {% if scope == 'recipe' %}checked{% endif %}> 中間レシピ</label>
    </div>
  </form>
  <div id="picker-error"></div>
  <div id="picker-results" class="picker-results">{% include "bakery/recipes/_picker_results.html" %}</div>
</section>
